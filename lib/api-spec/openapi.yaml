        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /admin/brands/{id}:
    patch:
      operationId: updateBrand
      tags: [content-admin]
      summary: Update a brand
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Brand not found
    delete:
      operationId: deleteBrand
      tags: [content-admin]
      summary: Delete a brand
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204":
          description: Brand deleted
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Brand not found
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [content-admin]
      summary: List all categories for the admin panel
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
    post:
      operationId: createCategory
      tags: [content-admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [content-admin]
      summary: Update a category
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Category not found
    delete:
      operationId: deleteCategory
      tags: [content-admin]
      summary: Delete a category
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204":
          description: Category deleted
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Category not found
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [content-admin]
      summary: List all products for the admin panel
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
    post:
      operationId: createProduct
      tags: [content-admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [content-admin]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
