openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RMS Rulmak kurumsal web sitesi, halka açık kataloglar ve yönetici API sözleşmesi
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Public product catalog
  - name: inquiries
    description: Public inquiry forms
  - name: dashboard
    description: Public catalog summaries
  - name: Auth
    description: Staff authentication endpoints
  - name: catalogs
    description: Public downloadable catalogs and restricted catalog management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the current authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the staff OIDC login flow
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: iss
          in: query
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect after authentication
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the staff session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect after logout
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid identity token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /catalogs:
    get:
      tags: [catalogs]
      operationId: listCatalogs
      summary: List published downloadable catalogs
      responses:
        "200":
          description: Published catalogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Catalog"
    post:
      tags: [catalogs]
      operationId: createCatalogRecord
      summary: Create a catalog record after uploading its PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogBody"
      responses:
        "201":
          description: Catalog created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "400":
          description: Invalid metadata or uploaded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /catalogs/admin:
    get:
      tags: [catalogs]
      operationId: listAdminCatalogs
      summary: List all catalogs for an authorized manager
      responses:
        "200":
          description: All catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Catalog"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /catalogs/uploads/request-url:
    post:
      tags: [catalogs]
      operationId: requestCatalogUploadUrl
      summary: Request a temporary upload URL for a PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogUploadUrlRequest"
      responses:
        "200":
          description: Temporary upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogUploadUrlResponse"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /catalogs/{id}:
    patch:
      tags: [catalogs]
      operationId: updateCatalogMetadata
      summary: Update catalog details or publication state
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogBody"
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Catalog not found
    delete:
      tags: [catalogs]
      operationId: deleteCatalog
      summary: Delete a catalog and its PDF
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "204":
          description: Catalog deleted
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Catalog not found
  /catalogs/{id}/download:
    get:
      tags: [catalogs]
      operationId: downloadCatalog
      summary: Download a published catalog PDF
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "200":
          description: PDF download
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Catalog not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List catalog products
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CategorySlug"
        - $ref: "#/components/parameters/BrandSlug"
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product by slug
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /brands:
    get:
      operationId: listBrands
      tags: [catalog]
      summary: List product brands
      responses:
        "200":
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get catalog dashboard summary
      responses:
        "200":
          description: Summary of catalog and service capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /contact-messages:
    post:
      operationId: createContactMessage
      tags: [inquiries]
      summary: Submit a public contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Contact message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReceipt"
        "400":
          description: Invalid form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /product-requests:
    post:
      operationId: createProductRequest
      tags: [inquiries]
      summary: Submit a public product information request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequestInput"
      responses:
        "201":
          description: Product request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReceipt"
        "400":
          description: Invalid form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sectors:
    get:
      operationId: listSectors
      tags: [content]
      summary: List industry sectors
      responses:
        "200":
          description: Sector list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
  /posts:
    get:
      operationId: listPosts
      tags: [content]
      summary: List published blog posts
      responses:
        "200":
          description: Blog post list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostSummary"
  /posts/{slug}:
    get:
      operationId: getPost
      tags: [content]
      summary: Get a published blog post by slug
      parameters:
        - $ref: "#/components/parameters/PostSlug"
      responses:
        "200":
          description: Blog post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/brands:
    get:
      operationId: listAdminBrands
      tags: [content-admin]
      summary: List all brands for the admin panel
      responses:
        "200":
          description: Brand list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBrand"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
    post:
      operationId: createBrand
      tags: [content-admin]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBrand"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
