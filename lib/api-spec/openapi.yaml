      summary: List all blog posts for the admin panel
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPost"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
    post:
      operationId: createPost
      tags: [content-admin]
      summary: Create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
  /admin/posts/{id}:
    patch:
      operationId: updatePost
      tags: [content-admin]
      summary: Update a blog post
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPost"
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Post not found
    delete:
      operationId: deletePost
      tags: [content-admin]
      summary: Delete a blog post
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204":
          description: Post deleted
        "401":
          description: Sign-in required
        "403":
          description: Manager access required
        "404":
          description: Post not found
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SearchQuery:
      name: q
      in: query
      description: Product name, product code, OEM code, brand or stock code
      schema:
        type: string
        maxLength: 120
    CategorySlug:
      name: category
      in: query
      schema:
        type: string
        maxLength: 80
    BrandSlug:
      name: brand
      in: query
      schema:
        type: string
        maxLength: 80
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PostSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    AuthUserEnvelope:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required: [user]
    MobileTokenExchangeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          format: uri
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
      required: [code, code_verifier, redirect_uri, state]
    MobileTokenExchangeSuccess:
      type: object
      properties:
        token:
          type: string
      required: [token]
    LogoutSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required: [success]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Catalog:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
      required: [id, title, brand, category, description, fileName, fileSize, published, createdAt, downloadUrl]
    CatalogUploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 52428800
        contentType:
          type: string
          const: application/pdf
      required: [name, size, contentType]
    CatalogUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
